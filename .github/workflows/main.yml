name: Docker build and push
on:
    push:
        branches:
            - master
    pull_request:
    schedule:
        - cron: "0 2 * * 0"
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7.0.1

            - uses: hadolint/hadolint-action@v3.4.0
              with:
                  dockerfile: Dockerfile
                  config: hadolint-ci.yaml

    ci:
        needs: lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - version: "3.12"
                      target: python-3-12
                    - version: "3.14"
                      target: python-3-14

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: Build image for scan
              run: >-
                  docker buildx bake "${{ matrix.target }}" --load
                  --set="${{ matrix.target }}.platform=linux/amd64"

            - name: Scan image for vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: acornsaustralia/python:${{ matrix.version }}
                  format: table
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: os,library
                  severity: CRITICAL,HIGH

    push:
        needs: ci
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: Log into registry
              uses: docker/login-action@v4.6.0
              with:
                  username: ${{ secrets.DOCKER_USER }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Push image
              run: docker buildx bake --push --provenance=mode=max --sbom=true
